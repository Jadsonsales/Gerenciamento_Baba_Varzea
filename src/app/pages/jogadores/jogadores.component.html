<div class="jog-header-row">
    <div>
        <h1 class="page-title">Cansados</h1>
        <p class="page-subtitle">{{ jogadores().length }} cadastrados · {{ totalAptos() }} aptos</p>
    </div>
    <button type="button" class="btn-green" (click)="abrirModal()">+ Novo Cansado</button>
</div>

<div class="jog-filters-row">
    <input class="search-input" [(ngModel)]="busca" placeholder="Buscar cansado..." style="flex:1">
    <select class="filter-sel" [(ngModel)]="filtroPosicao">
        <option value="">Todas posições</option>
        <option *ngFor="let p of posicoes" [value]="p">{{p}}</option>
    </select>
    <select class="filter-sel" [(ngModel)]="filtroStatus">
        <option value="">Todos status</option>
        <option value="Ativo">Ativo</option>
        <option value="Inativo">Inativo</option>
        <option value="Suspenso">Suspenso</option>
    </select>
</div>

<div class="players-grid">
    <div class="player-card" *ngFor="let j of filteredJogadores(); trackBy: trackById">
        <div class="pc-header">
            <div class="pc-avatar" [style.background]="j.cor">{{j.init}}</div>
            <div class="pc-info">
                <div class="pc-name">{{j.apelido}}</div>
                <div class="pc-fullname">{{j.nome}}</div>
            </div>
            <div class="pc-num">#{{j.num}}</div>
        </div>
        <div class="pc-tags">
            <span class="tag pos">{{j.posicao}}</span>
            <span class="tag" [class.tag-green]="j.status==='Ativo'" [class.tag-gray]="j.status==='Inativo'"
                [class.tag-yellow]="j.status==='Suspenso'">{{j.status}}</span>
        </div>
        <div class="pc-payment">
            <span class="badge" [class.badge-green]="j.pagamento==='Pago'"
                [class.badge-yellow]="j.pagamento==='Pendente'"
                [class.badge-red]="j.pagamento==='Atrasado'">{{j.pagamento}}</span>
            <button type="button" class="apto-badge" [class.apto]="j.apto" [class.inapto]="!j.apto"
                (click)="toggleApto(j)" title="Clique para marcar/desmarcar apto">
                {{j.apto ? '✓ Apto' : '○ Inapto'}}
            </button>
        </div>
        <div class="pc-stats">
            <div><span class="sn">{{j.jogos}}</span><span class="sl">jogos</span></div>
            <div><span class="sn green">{{j.gols}}</span><span class="sl">gols</span></div>
            <div><span class="sn">{{j.assist}}</span><span class="sl">assist.</span></div>
        </div>
        <button type="button" class="btn-excluir" (click)="confirmarExclusao(j)" title="Excluir jogador">
            🗑 Excluir
        </button>
    </div>
</div>

<!--
  FIX: este wrapper é movido para o <body> pelo componente (ngAfterViewInit),
  para que o modal nunca fique preso/cortado dentro de containers pais que
  tenham overflow:hidden, transform ou position:relative — a causa mais comum
  de um modal "não abrir de verdade" mesmo o *ngIf estando true.
-->
<div #modalPortal>
    <div class="modal-overlay" *ngIf="showModal">
        <div class="jog-modal">
            <h3>Novo Jogador</h3>
            <form (ngSubmit)="addJogador(); $event.preventDefault()">
                <div class="form-row">
                    <div class="field">
                        <label>Apelido</label>
                        <input [(ngModel)]="novo.apelido" name="apelido" placeholder="Carlão" autocomplete="off">
                    </div>
                    <div class="field">
                        <label>Número</label>
                        <input [(ngModel)]="novo.num" name="num" placeholder="21" autocomplete="off">
                    </div>
                </div>
                <div class="field">
                    <label>Nome Completo</label>
                    <input [(ngModel)]="novo.nome" name="nome" placeholder="Carlos Eduardo Santos" autocomplete="off">
                </div>
                <div class="form-row">
                    <div class="field">
                        <label>Posição</label>
                        <select [(ngModel)]="novo.posicao" name="posicao">
                            <option *ngFor="let p of posicoes" [value]="p">{{p}}</option>
                        </select>
                    </div>
                    <div class="field">
                        <label>Status</label>
                        <select [(ngModel)]="novo.status" name="status">
                            <option value="Ativo">Ativo</option>
                            <option value="Inativo">Inativo</option>
                            <option value="Suspenso">Suspenso</option>
                        </select>
                    </div>
                </div>
                <div style="display:flex; gap:12px; justify-content:flex-end; margin-top:20px">
                    <button type="button" class="btn-cancel" (click)="fecharModal()">Cancelar</button>
                    <button type="submit" class="btn-green">Salvar</button>
                </div>
            </form>
        </div>
    </div>
</div>
